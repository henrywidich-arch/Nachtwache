name: Patch notes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version and player-facing release notes
        env:
          PATCH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/check_patch_notes.py --base "$PATCH_BASE"
